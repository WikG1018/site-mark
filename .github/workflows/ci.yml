name: CI

on:
  pull_request:
  push:
    branches: [main, ohos-native]

permissions:
  contents: read

# A new push to the same branch/PR cancels the stale in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: flutter pub get
      - run: python -m pip install -r tool/icon-requirements.txt
      - run: python -m unittest tool.test_generate_launcher_icon tool.test_verify_launcher_icon_resources tool.test_verify_release_tag tool.test_release_workflow
      - name: Run HarmonyOS host tests
        shell: pwsh
        run: ./tool/ohos-native/run-host-tests.ps1
      - run: python tool/verify_launcher_icon_resources.py
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test pigeons packages/sitemark_system_api/lib
      - name: Check generated system bridge
        run: |
          dart run pigeon --input pigeons/system_api.dart
          dart format packages/sitemark_system_api/lib/src/system_api.g.dart
          git diff --exit-code -- \
            packages/sitemark_system_api/lib/src/system_api.g.dart \
            packages/sitemark_system_api/android/src/main/kotlin/io/github/wikg1018/sitemark/system/SystemApi.g.kt \
            packages/sitemark_system_api/ios/Classes/SystemApi.g.swift
      - run: flutter analyze
      - run: flutter test
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml
      - name: Check the HarmonyOS native Rust boundary
        run: |
          cargo clippy --manifest-path rust/Cargo.toml --no-default-features --features ohos-native --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --no-default-features --features ohos-native
      - name: Run Android unit tests
        run: |
          for attempt in 1 2 3; do
            if ./android/gradlew -p android :sitemark_system_api:testDebugUnitTest; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "::warning::Android unit tests failed; retrying after a transient-download backoff (attempt $attempt/3)."
            sleep "$((attempt * 10))"
          done
      - name: Build debug APK
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --debug; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "::warning::Debug APK build failed; retrying after a transient-download backoff (attempt $attempt/3)."
            sleep "$((attempt * 10))"
          done
      - name: Build unsigned release variant
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "::warning::Release APK build failed; retrying after a transient-download backoff (attempt $attempt/3)."
            sleep "$((attempt * 10))"
          done
      - name: Verify release APK has no forbidden permissions
        run: |
          AAPT2="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt2"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -x "$AAPT2"
          test -f "$APK"
          PERMISSIONS="$($AAPT2 dump permissions "$APK")"
          # D-023: INTERNET/ACCESS_NETWORK_STATE are required for the opt-in
          # NAS sync (WebDAV to a user-configured server) and must be present;
          # everything broader stays forbidden.
          for REQUIRED in \
            android.permission.INTERNET \
            android.permission.ACCESS_NETWORK_STATE; do
            if ! grep -Fq "$REQUIRED" <<<"$PERMISSIONS"; then
              echo "APK is missing required permission $REQUIRED" >&2
              exit 1
            fi
          done
          for FORBIDDEN in \
            android.permission.CAMERA \
            android.permission.ACCESS_BACKGROUND_LOCATION \
            android.permission.READ_MEDIA_IMAGES \
            android.permission.WRITE_EXTERNAL_STORAGE \
            android.permission.READ_EXTERNAL_STORAGE \
            android.permission.MANAGE_EXTERNAL_STORAGE \
            android.permission.READ_MEDIA_VIDEO \
            android.permission.READ_MEDIA_AUDIO; do
            if grep -Fq "$FORBIDDEN" <<<"$PERMISSIONS"; then
              echo "APK contains forbidden permission $FORBIDDEN" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v6
        with:
          name: sitemark-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios:
    # Compile-only gate for the iOS platform scaffold: the full Dart/Rust/HarmonyOS
    # test matrix already runs on the ubuntu `test` job in the same PR run.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - run: flutter pub get
      - name: Run Swift bridge policy tests
        run: swift test --package-path packages/sitemark_system_api/ios
      - name: Build unsigned iOS app
        run: |
          for attempt in 1 2 3; do
            if flutter build ios --no-codesign --release; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "::warning::iOS build failed; retrying after a transient-download backoff (attempt $attempt/3)."
            sleep "$((attempt * 10))"
          done
      - name: Verify iOS app metadata
        run: |
          PLIST="build/ios/iphoneos/Runner.app/Info.plist"
          test -f "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST" | grep -Fx "SiteMark"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" | grep -Fx "1.0.13"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST" >/dev/null
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST" >/dev/null
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$PLIST" >/dev/null
          test -z "$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$PLIST" 2>/dev/null)"
          test -z "$(/usr/libexec/PlistBuddy -c 'Print :NSBluetoothAlwaysUsageDescription' "$PLIST" 2>/dev/null)"
          # Background task wiring: exactly one permitted identifier matching
          # the Dart/AppDelegate constant, and only the processing mode.
          # PlistBuddy prints arrays as "Array {\n    element\n}" — strip the
          # wrapper before matching/counting.
          plist_array_items() {
            /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST" | sed -e 's/^[[:space:]]*//' -e '/^Array {$/d' -e '/^}$/d'
          }
          test "$(plist_array_items BGTaskSchedulerPermittedIdentifiers | grep -c .)" -eq 1
          plist_array_items BGTaskSchedulerPermittedIdentifiers | grep -Fx "io.github.wikg1018.sitemark.capture-processing"
          test "$(plist_array_items UIBackgroundModes | grep -c .)" -eq 1
          plist_array_items UIBackgroundModes | grep -Fx "processing"
      - name: Upload unsigned iOS app artifact
        uses: actions/upload-artifact@v6
        with:
          name: sitemark-ios-unsigned
          path: build/ios/iphoneos/Runner.app
