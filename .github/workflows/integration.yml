name: Integration

# Device-backed integration tests. Not on pull_request — slower/flakier than unit
# tests and needs an Android emulator. Runs nightly and on manual dispatch only
# (not every push to main) to control CI cost.

on:
  workflow_dispatch:
  schedule:
    # ~05:17 UTC daily — off the hour to reduce fleet contention
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  android-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'system-images;android-34;google_apis;x86_64'
      - run: flutter pub get
      - name: Warm Gradle and Android build caches
        run: ./android/gradlew -p android :sitemark_system_api:testDebugUnitTest
      - name: Warm Flutter Android build and native assets
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --debug; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "::warning::Flutter Android build failed; retrying after a transient-download backoff (attempt $attempt/3)."
            sleep "$((attempt * 10))"
          done
      - name: Allow the integration runner to bind its loopback VM service
        # `flutter test integration_test/...` installs app-debug.apk rather than
        # an androidTest APK. The Dart VM service therefore needs INTERNET in
        # that one CI build to bind 127.0.0.1. These edits only touch the runner
        # checkout; every committed debug/profile/release manifest stays offline.
        run: |
          for manifest in \
            android/app/src/main/AndroidManifest.xml \
            android/app/src/debug/AndroidManifest.xml; do
            grep -q 'android.permission.INTERNET" tools:node="remove"' "$manifest"
            sed -i 's|android.permission.INTERNET" tools:node="remove"|android.permission.INTERNET"|' "$manifest"
          done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start adb server
        run: |
          ADB="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools/adb"
          "$ADB" start-server
          "$ADB" version | head -1
      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          # Fail fast instead of burning the job timeout: a healthy KVM boot
          # completes well under five minutes; a device that stays offline
          # beyond that has a broken emulator setup, not a slow one.
          # Previous runs all hit the 60-minute job timeout with
          # `adb: device offline` from the first probe.
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p integration-artifacts
            timeout --signal=KILL 10s adb logcat -c || true
            sh -c 'timeout --signal=INT --kill-after=60s 12m flutter test integration_test/simple_test.dart --reporter expanded; test_status=$?; timeout --signal=KILL 30s adb logcat -d -v threadtime > integration-artifacts/logcat.txt || true; exit "$test_status"'
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-integration-diagnostics
          path: integration-artifacts
          if-no-files-found: warn
